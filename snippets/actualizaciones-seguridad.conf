// /etc/apt/apt.conf.d/52seguridad-unattended (ejemplo, Debian)
//
// Objetivo: instalar a diario SOLO lo que venga del repositorio de seguridad de Debian.
// Nada de actualizaciones del Debian principal, backports, hipervisor ni repositorios de terceros:
// eso se hace a mano, en ventana sin uso y con snapshot previo.
//
// TRAMPA: APT SUMA las listas de todos los ficheros de apt.conf.d. El fichero del paquete
// (50unattended-upgrades) ya incluye el Debian principal. Sin el `#clear` de abajo, añadir
// este fichero no restringe nada: se sigue instalando de todo.
//
// Comprobar después:
//   apt-config dump | grep Origins-Pattern::      -> debe salir UNA línea
//   unattended-upgrade --dry-run --debug          -> el resto de orígenes, «not allowed»

#clear Unattended-Upgrade::Origins-Pattern;

Unattended-Upgrade::Origins-Pattern {
  "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
};

// Nunca reiniciar solo: si hace falta, lo avisa el informe semanal y se reinicia a mano.
Unattended-Upgrade::Automatic-Reboot "false";

// No tocar kernels ni dependencias automáticamente.
Unattended-Upgrade::Remove-Unused-Kernel-Packages "false";
Unattended-Upgrade::Remove-Unused-Dependencies "false";
Unattended-Upgrade::Remove-New-Unused-Dependencies "false";

// Guardar las copias de ficheros anteriores FUERA de apt.conf.d: APT ignora allí los `.bak-*`,
// pero imprime «Ignoring file» en cada orden.
